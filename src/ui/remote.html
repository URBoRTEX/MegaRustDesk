<html window-resizable window-frame="extended">

<head>
    <meta charset="utf-8">
    <style>
        @import url(common.css);
        @import url(remote.css);
        @import url(file_transfer.css);
        @import url(header.css);
    </style>
    <script type="text/tiscript">
            include "common.tis";
            include "msgbox.tis";
            include "remote.tis";
            include "file_transfer.tis";
            include "port_forward.tis";
            include "grid.tis";
            include "header.tis";
            include "printer.tis";
            include "agent.tis";
        </script>
</head>
<header>
    <div.window-icon role="window-icon">
        <icon />
        </div>
        <caption role="window-caption" />
        <div.window-toolbar />
        <div.window-buttons />
</header>

<body>
    <div #video-wrapper>
        <video #handler>
            <div #quality-monitor style="position: absolute; display: none" />
            <div style="position: relative">
                <img #cursor src="in-memory:cursor" />
            </div>
        </video>
    </div>
    <div #file-transfer-wrapper>
    </div>
    <section #agent-panel>
        <h2>Codex через MCP</h2>
        <div #agent-target />
        <div #agent-connection>Ожидание подключения Codex</div>
        <button .button #agent-start>Разрешить Codex</button>
        <div #agent-status>Подключение…</div>
        <div .agent-actions>
            <button .button .outline #agent-pause>Пауза</button>
            <button .button .outline #agent-resume>Продолжить</button>
            <button .button .outline #agent-stop>Стоп</button>
        </div>
        <button .button .outline #agent-manual>Взять управление</button>
        <button .button .outline #agent-viewer>Скрыть просмотр</button>
        <div .agent-help>Задачи задаются во внешнем Codex. Здесь — только подключение и управление доступом.</div>
        <button .button .outline #agent-exit>Выйти</button>
    </section>
    <div #msgbox />
</body>

</html>
