<html window-resizable window-frame="extended">

<head>
    <meta charset="utf-8">
    <style>
        @import url(common.css);
        @import url(remote.css);
        @import url(file_transfer.css);
        @import url(header.css);
    </style>
    <script type="text/tiscript">
            include "common.tis";
            include "msgbox.tis";
            include "remote.tis";
            include "file_transfer.tis";
            include "port_forward.tis";
            include "grid.tis";
            include "header.tis";
            include "printer.tis";
            include "agent.tis";
        </script>
</head>
<header>
    <div.window-icon role="window-icon">
        <icon />
        </div>
        <caption role="window-caption" />
        <div.window-toolbar />
        <div.window-buttons />
</header>

<body>
    <div #video-wrapper>
        <video #handler>
            <div #quality-monitor style="position: absolute; display: none" />
            <div style="position: relative">
                <img #cursor src="in-memory:cursor" />
            </div>
        </video>
    </div>
    <div #file-transfer-wrapper>
    </div>
    <section #agent-panel>
        <div #agent-heading>
            <h2>Управление</h2>
            <button .button .outline #agent-collapse title="Свернуть панель" aria-label="Свернуть панель" aria-expanded="true">›</button>
        </div>
        <button .button #agent-reclaim title="Вернуть управление себе" aria-label="Вернуть управление себе">Я</button>
        <div #agent-content>
            <div #agent-target />
            <div #agent-status>Подключение…</div>
            <button .button #agent-start>Передать Codex</button>
            <button .button .outline #agent-paste title="Вставить текст из буфера обмена — Ctrl+V">Вставить текст</button>
            <div #agent-feedback />
            <button .button .outline #agent-viewer>Скрыть просмотр</button>
            <button .button .outline #agent-exit>Выйти</button>
        </div>
    </section>
    <div #msgbox />
</body>

</html>
